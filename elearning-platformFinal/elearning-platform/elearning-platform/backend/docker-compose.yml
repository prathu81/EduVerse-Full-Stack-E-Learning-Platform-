version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: elearning_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: elearning_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    container_name: elearning_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: elearning_db
      DB_PORT: 3306
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db

volumes:
  db_data: