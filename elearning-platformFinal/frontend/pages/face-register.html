<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Face</title>
    <!-- face-api.js library -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f3f4f6; padding: 20px; }
        .video-container { width: 640px; height: 480px; margin: 20px auto; background: #000; border: 4px solid #10B981; border-radius: 10px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        button { padding: 12px 25px; font-size: 16px; background-color: #10B981; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>Step 1: Register Your Face</h2>
    
    <div class="video-container">
        <video id="video" autoplay muted playsinline></video>
    </div>
    
    <p id="status">⏳ Loading AI Models...</p>
    
    <button id="registerBtn" disabled>Register My Face</button>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        const registerBtn = document.getElementById('registerBtn');

        async function loadModels() {
            try {
                statusText.innerText = "⏳ Loading models from server...";
                // Models load hotatayt
                await faceapi.nets.ssdMobilenetv1.loadFromUri('/models');
                await faceapi.nets.faceLandmark68Net.loadFromUri('/models');
                await faceapi.nets.faceRecognitionNet.loadFromUri('/models');
                
                statusText.innerText = "✅ Models loaded! Starting camera...";
                statusText.style.color = "blue";
                startVideo();
            } catch (error) {
                console.error("Model Error:", error);
                statusText.innerText = "❌ Error loading models. Check console.";
                statusText.style.color = "red";
            }
        }

        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then(stream => {
                    video.srcObject = stream;
                    statusText.innerText = "✅ Camera Ready! Look at the camera and click Register.";
                    statusText.style.color = "green";
                    registerBtn.disabled = false;
                })
                .catch(err => {
                    console.error("Camera Error:", err);
                    statusText.innerText = "❌ Camera access denied or not available.";
                    statusText.style.color = "red";
                });
        }

        registerBtn.addEventListener('click', async () => {
            statusText.innerText = "🔍 Scanning face...";
            statusText.style.color = "orange";
            registerBtn.disabled = true;

            try {
                const detection = await faceapi.detectSingleFace(video)
                                               .withFaceLandmarks()
                                               .withFaceDescriptor();

                if (!detection) {
                    statusText.innerText = "❌ No face detected. Try looking directly at the camera.";
                    statusText.style.color = "red";
                    registerBtn.disabled = false;
                    return;
                }

                const descriptorArray = Array.from(detection.descriptor);
                const token = localStorage.getItem('token'); 

                const response = await fetch('/api/register-face', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ faceDescriptor: descriptorArray })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    statusText.innerText = "🎉 Face Registered Successfully!";
                    statusText.style.color = "green";
                } else {
                    statusText.innerText = "❌ Failed: " + (result.error || "Try again");
                    statusText.style.color = "red";
                    registerBtn.disabled = false;
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "❌ Server error occurred.";
                statusText.style.color = "red";
                registerBtn.disabled = false;
            }
        });

        window.onload = loadModels;
    </script>
</body>
</html>
